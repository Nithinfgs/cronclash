[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cronclash"
version = "0.1.0"
description = "Find cron jobs that fire at the same moment (crontab, GitHub Actions, Kubernetes) and stagger them."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3"]

[project.scripts]
cronclash = "cronclash.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
